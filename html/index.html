<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUCHAN | Votre shopping en ligne</title>
    <meta
      name="description"
      content="Découvrez notre catalogue AUCHAN : vétements, électronique et bien plus; Explorez nos produits et composez votre paier en ligne."
    />

    <link rel="icon" href="../assets/photos/favicon-tab.ico" type="" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="mx-auto max-w-[1600px] font-['Inter',_sans-serif]">
    <div
      class="flex items-center justify-between bg-[#d01e15] text-white px-3 sm:px-4 md:px-8 py-2 text-sm"
    >
      <div class="flex w-full items-center justify-between">
        <button type="button" class="flex items-center gap-4 text-left">
          <span>Choisir vos courses</span>
          <span
            ><img src="../assets/photos/right-arrow.png" class="w-6 h-6"
          /></span>
        </button>
        <nav class="hidden md:flex">
          <div class="flex gap-4">
            <a href="index.html" class="border-r border-white/50 pr-4"
              >Accueil</a
            >
            <a href="admin.html" class="border-r border-white/50 pr-4"
              >Administration</a
            >
            <a href="contact.html">Contact</a>
          </div>
        </nav>
        <button type="button" class="md:hidden" aria-label="ouvrir le menu">
          <img src="../assets/photos/white-burgur-.png" class="w-8" />
        </button>
      </div>
    </div>
    <header class="sticky top-0 z-50">
      <div
        class="flex border-slate-200 border-b items-center md:gap-5 justify-between bg-white gap-2 px-3 py-3 sm:gap-3 md:px-6 md:py-4"
      >
        <div>
          <a href="#index">
            <img
              class="block w-10 md:hidden"
              src="../assets/photos/favicon-tab.ico"
              alt="auchan icon"
            />
            <img
              class="hidden w-36 md:block"
              src="../assets/photos/auchan-logo-desktop.svg"
              alt="auchan logo"
            />
          </a>
        </div>
        <button
          class="flex justify-between gap-4 border border-slate-200 rounded-xl p-2"
        >
          <img
            src="../assets/photos/burgur-menu.png"
            alt="burgur menu icone"
            class="w-6"
          />
          <span class="font-700 hidden sm:inline">Categories</span>
        </button>
        <div
          class="flex flex-1 min-w-0 justify-between gap-4 border border-slate-200 rounded-xl p-2"
        >
          <img
            src="../assets/photos/icon-chercher.png"
            alt="search icone"
            class="w-6 shrink-0"
          />
          <input
            type="search"
            placeholder="search ..."
            class="w-full min-w-0 border-none focus:outline-none"
          />
        </div>
        <button type="button">
          <img
            src="../assets/photos/icons-utilisateur.png"
            alt="profile icone"
            class="w-8 shrink-0"
          />
        </button>

        <button type="button">
          <img
            src="../assets/photos/icon-shopping.png"
            alt="panier icon"
            class="w-8 shrink-0"
          />
        </button>
      </div>
    </header>
    <main class="min-h-[2000px]"></main>
  </body>
</html>
