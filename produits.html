<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AUCHAN | Nos Produits</title>
    <meta
      name="description"
      content="Explorer notre catalogue de produits AUCHAN : alimentation, maison, beauté, électronique et bien plus. TRouver vos produits préférés au meilleur prix."
    />

    <link rel="icon" href="./assets/photos/favicon-tab.ico" type="" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="mx-auto max-w-[1600px] font-['Inter',_sans-serif]">
    <!-- header to fetch -->
    <div
      class="flex items-center justify-between bg-[#d01e15] text-white px-3 sm:px-4 md:px-8 py-2 text-sm"
    >
      <div class="flex w-full items-center justify-between">
        <button type="button" class="flex items-center gap-4 text-left">
          <span>Choisir vos courses</span>
          <span
            ><img src="./assets/photos/right-arrow.png" class="w-6 h-6"
          /></span>
        </button>
        <nav class="hidden md:flex">
          <div class="flex gap-4">
            <a
              href="index.html"
              class="border-r border-white/50 pr-4 hover:underline"
              id="accueil"
              >Accueil</a
            >
            <a
              href="produits.html"
              class="border-r border-white/50 pr-4 hover:underline"
              id="produits"
              >Produits</a
            >
            <a
              href="admin.html"
              class="border-r border-white/50 pr-4 hover:underline"
              id="administration"
              >Administration</a
            >
            <a href="contact.html" class="hover:underline" id="contact"
              >Contact</a
            >
          </div>
        </nav>
        <button type="button" class="md:hidden" aria-label="ouvrir le menu">
          <img src="./assets/photos/white-burgur-.png" class="w-8" />
        </button>
      </div>
    </div>
    <header class="sticky top-0 z-50">
      <div
        class="flex border-slate-200 border-b shadow-sm items-center md:gap-5 justify-between bg-white gap-2 px-3 py-3 sm:gap-3 md:px-6 md:py-4"
      >
        <div>
          <a href="#index">
            <img
              class="block w-10 md:hidden"
              src="./assets/photos/favicon-tab.ico"
              alt="auchan icon"
            />
            <img
              class="hidden w-36 md:block"
              src="./assets/photos/auchan-logo-desktop.svg"
              alt="auchan logo"
            />
          </a>
        </div>
        <button
          id="categoryBtn"
          class="flex justify-between gap-4 hover:border hover:border-slate-200 hover:rounded-xl p-2"
        >
          <img
            src="./assets/photos/burgur-menu.png"
            alt="burgur menu icone"
            class="w-6"
          />
          <span class="font-700 hidden sm:inline">Categories</span>
        </button>
        <div
          class="flex flex-1 min-w-0 justify-between gap-4 border border-slate-200 rounded-xl p-2 bg-slate-50 hover:bg-white"
        >
          <img
            src="./assets/photos/icon-chercher.png"
            alt="search icone"
            class="w-6 shrink-0"
          />
          <input
            id="searchInput"
            type="search"
            placeholder="search ..."
            class="w-full min-w-0 border-none focus:outline-none"
          />
        </div>
        <button type="button">
          <img
            src="./assets/photos/icons-utilisateur.png"
            alt="profile icone"
            class="w-8 shrink-0"
          />
        </button>

        <button type="button">
          <img
            src="./assets/photos/icon-shopping.png"
            alt="panier icon"
            class="w-8 shrink-0"
          />
        </button>
      </div>
    </header>
    <main class="min-h-[2000px] bg-slate-100" id="produits">
      <div>
        <div>
          <img
            src="./assets/photos/desktop-main-pic.png"
            class="hidden lg:block"
          />
        </div>
        <div>
          <img
            src="./assets/photos/tablet-main-pic.png"
            class="hidden md:block lg:hidden"
          />
        </div>
        <div>
          <img
            src="./assets/photos/main-pic.png"
            class="block lg:hidden md:hidden w-full"
          />
        </div>
      </div>
      <div></div>
    </main>
    <footer
      class="w-full border-slate-200 border-t shadow-sm sm:px-4 md:px-8 py-2 text-sm h-10 bg-white text-black"
    >
      <div
        class="grid grid-col-1 md:grid-col-2 lg:grid-col-4 border-b border-slate-200"
      >
        <div
          class="flex flex-wrap md:flex-nowrap lg:flex-nowrap items-center justify-between"
        >
          <img src="./assets/photos/retrait.svg" alt="icon" class="w-10 h-10" />
          <p>Vos courses à domicile, en drive ou click & collect</p>
        </div>
        <div
          class="flex flex-wrap md:flex-nowrap lg:flex-nowrap items-center justify-between"
        >
          <img
            src="./assets/photos/paiement_securise.svg"
            alt="icon"
            class="w-10 h-10"
          />
          <p>Paiement sécurisé en ligne ou au retrait</p>
        </div>
        <div
          class="flex flex-wrap md:flex-nowrap lg:flex-nowrap items-center justify-between"
        >
          <img src="./assets/photos/retour.svg" alt="icon" class="w-10 h-10" />
          <p>Retour produit: 30 jours pour changer d'avis</p>
        </div>
        <div
          class="flex flex-wrap md:flex-nowrap lg:flex-nowrap items-center justify-between"
        >
          <img
            src="./assets/photos/service_client.svg"
            alt="icon"
            class="w-10 h-10"
          />
          <p>Service client 7j/7</p>
        </div>
      </div>
    </footer>
    <!-- <script src="../js/ui.js"></script> -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
